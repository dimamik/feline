<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Feline demo - pipecat client</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      button { font-size: 1rem; padding: 0.5rem 1.25rem; cursor: pointer; }
      #status { margin-left: 0.75rem; color: #666; }
      .indicators { display: flex; gap: 1rem; margin: 1rem 0; }
      .indicator { padding: 0.25rem 0.75rem; border-radius: 999px; background: #eee; color: #999; }
      .indicator.active { background: #d1fae5; color: #065f46; }
      #transcript { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; min-height: 16rem; }
      .line { margin: 0.25rem 0; }
      .line.user { color: #1d4ed8; }
      .line.bot { color: #111; }
      .line.event { color: #999; font-size: 0.85rem; }
      form { display: flex; gap: 0.5rem; margin-top: 1rem; }
      input { flex: 1; font-size: 1rem; padding: 0.5rem; }
    </style>
    <script type="module" crossorigin src="/assets/index-DxPxMeTe.js"></script>
  </head>
  <body>
    <h1>Feline &times; pipecat client</h1>
    <div>
      <button id="toggle">Connect</button>
      <span id="status">disconnected</span>
    </div>
    <div class="indicators">
      <span class="indicator" id="user-speaking">you speaking</span>
      <span class="indicator" id="bot-speaking">bot speaking</span>
    </div>
    <div id="transcript"></div>
    <form id="text-form">
      <input id="text-input" placeholder="Or type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </body>
</html>
